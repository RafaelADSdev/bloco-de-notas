<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181715" />
    <meta name="description" content="Crie cadernos, organize suas ideias e anote PDFs no Linha Clara." />
    <link rel="icon" type="image/png" href="/linha-clara.png" />
    <title>Linha Clara · Biblioteca de anotações</title>
    <script>
      try {
        if (localStorage.getItem('linha-clara:theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#f6f0e6'
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
