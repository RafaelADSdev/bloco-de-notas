<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#181715" />
    <meta name="description" content="Crie cadernos, organize suas ideias e anote PDFs no Linha Clara." />
    <link rel="icon" type="image/png" href="/linha-clara.png" />
    <title>Linha Clara · Biblioteca de anotações</title>
    <script>
      const entryUrl = new URL(location.href)
      const enableMotion = entryUrl.searchParams.get('motion') === 'full'
      if (enableMotion) {
        document.documentElement.dataset.motion = 'full'
        entryUrl.searchParams.delete('motion')
        history.replaceState(history.state, '', entryUrl)
      }
      try {
        const theme = localStorage.getItem('linha-clara:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
        if (theme === 'light') document.querySelector('meta[name="theme-color"]').content = '#f6f0e6'
        if (enableMotion) {
          localStorage.setItem('linha-clara:motion', 'full')
        } else {
          const motion = localStorage.getItem('linha-clara:motion')
          if (motion === 'full' || motion === 'reduced') document.documentElement.dataset.motion = motion
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
